[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-contribution-tool"
version = "0.9.0b1"
description = "Contribution analysis tool for the EventHub course project (GitHub + Taiga)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hakan Duman" }]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
contribution-tool = "contribution_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.3",
    "pre-commit>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
