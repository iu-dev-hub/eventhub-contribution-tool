kind = "pull_request"
title = "PR açıklaması"

[[items]]
id = "pr.work_item"
question = "Taiga numarası TG-<no> biçiminde (ör. TG-42) yazılmış mı?"
source = "eventhub .github/pull_request_template.md; CONTRIBUTING.md §3"
tip = "PR şablonundaki 'Related work item' bölümüne Taiga numarasını TG-42 biçiminde yaz; böylece kod, işin kaydına bağlanır."

[[items]]
id = "pr.no_auto_close"
question = "TG numarasından sonra '#closed' gibi Taiga kaydını kapatan bir durum yazılmamış mı?"
source = "eventhub .github/pull_request_template.md"
tip = "TG numarasından sonra '#closed' yazma: Hikâyeyi yalnızca PO, kabul ederek kapatır."

[[items]]
id = "pr.what_changed"
question = "Hangi özelliğin veya değişikliğin yapıldığı açıkça anlatılmış mı?"
source = "eventhub .github/pull_request_template.md"
tip = "'What changed?' bölümünde değişikliği bir iki cümleyle anlat: hangi ekran, hangi kural, hangi davranış değişti."

[[items]]
id = "pr.why"
question = "Değişikliğin nedeni (hangi ihtiyaç, iş kuralı veya hata için yapıldığı) yazılmış mı?"
source = "sektör uygulaması: PR açıklamasında 'ne ve neden'"
tip = "Değişikliğin nedenini de yaz (ör. 'BR-3.2 gereği', 'TG-57 hatası için'). İnceleyen ve ileride kodu okuyan kişi kararı ancak böyle anlar."
industry = true

[[items]]
id = "pr.how_tested"
question = "Hangi testlerin eklendiği veya çalıştırıldığı yazılmış mı?"
source = "eventhub .github/pull_request_template.md; docs/guides/pull-requests.md §2"
tip = "'How was it tested?' bölümünde eklediğin test dosyalarını ve neyi doğruladıklarını yaz; test içermeyen PR onaylanmaz."

[[items]]
id = "pr.test_technique"
question = "Kullanılan test tasarım tekniği (sınır değer, denklik sınıfı, karar tablosu vb.) belirtilmiş mi?"
source = "eventhub .github/pull_request_template.md; CONTRIBUTING.md §7"
tip = "Testleri hangi teknikle tasarladığını yaz (ör. 'sınır değer: kapasite 100 için 98/99/100'). Bu, testlerin rastgele değil bilinçli seçildiğini gösterir."

[[items]]
id = "pr.ai_usage"
question = "Yapay zekâ kullanımı ve yapay zekâ çıktısında neyin düzeltildiği yazılmış mı?"
source = "eventhub CONTRIBUTING.md §6"
tip = "'AI usage' bölümünü doldur; kullanmadıysan 'None' yaz. Kullandıysan çıktıda neyi kontrol edip düzelttiğini belirt."

[[items]]
id = "pr.single_task"
question = "Açıklama tek bir işi mi anlatıyor (birden fazla ilgisiz değişiklik karışmamış)?"
source = "eventhub CONTRIBUTING.md §4"
tip = "Her PR tek bir işi kapsasın. İlgisiz değişiklikleri ayrı PR'lara böl; küçük PR'lar daha hızlı ve daha dikkatli incelenir."
